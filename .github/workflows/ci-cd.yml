name: CI-CD project

on:
  push:
    branches:
      - main

jobs:

  ci:
    name: Continous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install backend dependencies
        run: |
          cd backend
          npm install 
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Docker Image to DockerHub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }}
      
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }} \
            ./backend
      
      - name: Push Backend Docker Image to DockerHub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }}
      

      - name: Deploy to EC2
        uses: appleboy/ssh-actions@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: | 
            whoami
            uname
            kubectl get nodes

