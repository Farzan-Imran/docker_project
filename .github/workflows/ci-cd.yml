```yaml
name: CI-CD project

on:
  push:
    branches:
      - main

jobs:

  code-quality:
    name: Code quality, build and push images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }}


  deployment:
    name: Deploy to EC2 using Helm
    runs-on: ubuntu-latest
    needs: code-quality

    steps:

      - name: Deploy to Kubernetes using Helm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Checking Kubernetes connection"
            echo "======================================"

            kubectl cluster-info


            echo "======================================"
            echo "Checking Helm"
            echo "======================================"

            helm version


            echo "======================================"
            echo "Updating project repository"
            echo "======================================"

            cd /home/ubuntu/docker_project

            git pull origin main


            echo "======================================"
            echo "Deploying application using Helm"
            echo "======================================"

            helm upgrade --install to-do-app \
              /home/ubuntu/docker_project/k8s/to-do-app \
              --create-namespace \
              --namespace to-do-test \
              --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend \
              --set frontend.image.tag=${{ github.sha }} \
              --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend \
              --set backend.image.tag=${{ github.sha }} \
              --wait \
              --atomic \
              --timeout 5m


            echo "======================================"
            echo "Deployment succeeded"
            echo "======================================"


            echo "======================================"
            echo "Checking Pods"
            echo "======================================"

            kubectl get pods -n to-do-test


            echo "======================================"
            echo "Checking Services"
            echo "======================================"

            kubectl get svc -n to-do-test


            echo "======================================"
            echo "Checking Deployed Images"
            echo "======================================"

            kubectl get deployment frontend -n to-do-test \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""

            kubectl get deployment backend -n to-do-test \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""
```
