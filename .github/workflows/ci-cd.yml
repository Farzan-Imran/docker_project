name: CI-CD project

on:
  push:
    branches:
      - main

jobs:

  code-quality:
    name: Code quality, build and push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Install backend dependencies
        run: |
          cd backend
          npm install 
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Docker Image to DockerHub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-frontend:${{ github.sha }}
      
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }} \
            ./backend
      
      - name: Push Backend Docker Image to DockerHub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/to-do-backend:${{ github.sha }}
      
  deployment:
    name:  Deploy to EC2 using helm
    runs-on: ubuntu-latest
    needs: code-quality

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Helm chart to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/to-do-app"
          target: "/home/${{ secrets.EC2_HOST }}deployment"

      - name: Deploy to Kubernetes using Helm
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: IMAGE_TAG, DOCKERHUB_USERNAME

          script: |
            
            echo "Checking Kubernetes connection"
            kubectl cluster-info

            echo "Verifying Helm"
            helm version

            echo "Deploying application using helm"

            helm upgrade --install to-do-app \
              /home/${{ secrets.EC2_USERNAME}}/deployment/to-do-app \
              --create-namespace to-do-test1 \
              --namespace to-do-test1 \
              --set frontend.image.repository=$DOCKERHUB_USERNAME/to-do-frontend \
              --set frontend.image.tag=$IMAGE_TAG \ 
              --set backend.image.repository=$DOCKERHUB_USERNAME/to-do-backend \
              --set backend.image.tag=$IMAGE_TAG \
              --wait \
              --atomic \
              --timeout 5m 

            echo "Deployment Succeeded"

            echo "Checking pods"
            kubectl get pods -n to-do-app

            echo "Checking services"
            kubectl get svc -n to-do-app