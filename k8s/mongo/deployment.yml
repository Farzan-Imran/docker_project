apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongo
  namespace: to-do-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: mongo:latest
          
          ports:
            - containerPort: 27017
      
          volumeMounts:
            -  name: mongodb-storage
               mountPath: /data/db

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

    